<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>폴리곤과 운명의 주사위 — 경우의 수와 확률</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <style>
    :root {
      --bg-dark: #12141a;
      --card-bg: rgba(22, 27, 34, 0.92);
      --accent: #e5a93b;
      --text-main: #f0f6fc;
      --text-dim: #8b949e;
      --border: rgba(240, 246, 252, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      overflow: hidden;
      width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    #game-container {
      position: relative;
      width: 100%; height: 100%;
      max-width: 1200px; max-height: 720px;
      aspect-ratio: 16 / 9;
      background: #0b0d12;
      overflow: hidden;
      box-shadow: 0 12px 48px rgba(0,0,0,0.8);
      border-radius: 8px;
    }
    #tension-wrap {
      position: absolute; top: 10px; left: 24px; right: 24px; height: 8px;
      background: rgba(255,255,255,0.08); border-radius: 4px; z-index: 5;
    }
    #tension-fill { height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width 0.35s; }
    #stage-layer { position: absolute; inset: 0 0 150px 0; }
    #stage-layer {
      background: linear-gradient(180deg, #3a2a1c 0%, #1a120c 55%, #0e0c0a 100%);
    }
    .actor {
      position: absolute; bottom: 150px; width: 88px; text-align: center; color: #f0e6d2;
      font-size: 0.85rem; font-weight: 700;
    }
    .actor i {
      display: block; width: 64px; height: 108px; margin: 0 auto 6px; border-radius: 32px 32px 12px 12px;
    }
    .actor.theron { left: 18%; }
    .actor.theron i { background: #c4783a; }
    .actor.iris { right: 18%; }
    .actor.iris i { background: #d7c4a3; }
    #widget-root { background: rgba(6,5,4,0.55); display: flex; align-items: center; justify-content: center; }
    .popup {
      width: min(980px, 98%); background: #24180f; border: 2px solid #e5a93b;
      border-radius: 16px; padding: 18px 20px; box-shadow: 0 16px 40px rgba(0,0,0,0.45);
    }
    .path-pop { background: #fff; color: #1a1a1a; width: min(980px, 98%); }
    .path-pop svg { width: 100%; height: min(62vh, 520px); }
    .path-pop .dice-hint, .path-pop .dice-readout { color: #1a1a1a; }
    .roll-scene { height: 200px; display: flex; align-items: center; justify-content: center; perspective: 700px; }
    .cube { width: 84px; height: 84px; position: relative; transform-style: preserve-3d; }
    .cube .face {
      position: absolute; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center;
      background: #f3e2bc; color: #2a1c0c; border: 2px solid #6b4a22; font-size: 32px; font-weight: 800;
      backface-visibility: hidden;
    }
    .f1 { transform: translateZ(42px); }
    .f6 { transform: rotateY(180deg) translateZ(42px); }
    .f3 { transform: rotateY(90deg) translateZ(42px); }
    .f4 { transform: rotateY(-90deg) translateZ(42px); }
    .f2 { transform: rotateX(90deg) translateZ(42px); }
    .f5 { transform: rotateX(-90deg) translateZ(42px); }
    .roll-form { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .roll-form input { width: 72px; font-size: 1.1rem; padding: 6px 8px; border-radius: 8px; border: 1px solid #e5a93b; }
    .roll-form button { background: #e5a93b; border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 700; }

    #widget-root { position: absolute; inset: 8px 8px 108px 8px; z-index: 8; }
    #widget-root[hidden] { display: none !important; }
    #focus-lines {
      pointer-events: none; position: absolute; inset: 0; opacity: 0; z-index: 7;
      background: repeating-linear-gradient(90deg, transparent, transparent 46%, rgba(229,169,59,0.25) 50%, transparent 54%);
      transition: opacity 0.2s;
    }
    #focus-lines.on { opacity: 1; }
    #evidence-bag { position: absolute; top: 24px; left: 24px; z-index: 6; min-height: 28px; }
    #evidence-bag .card {
      background: #2b2110; color: var(--accent); border: 1px solid var(--accent);
      padding: 6px 10px; border-radius: 8px; font-size: 0.85rem;
    }
    #dialogue-layer {
      position: absolute; bottom: 16px; left: 24px; right: 24px; min-height: 140px;
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 24px; backdrop-filter: blur(12px);
      display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; z-index: 4;
    }
    .speaker-name { font-weight: 700; font-size: 1.1rem; color: var(--accent); margin-bottom: 6px; }
    .dialogue-text { font-size: 1.05rem; line-height: 1.6; min-height: 50px; }
    .next-indicator { align-self: flex-end; font-size: 0.85rem; color: var(--text-dim); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
    .screen-shake { animation: shake 400ms linear both; }
    @keyframes shake {
      10%,90%{transform:translate3d(-2px,0,0)}
      20%,80%{transform:translate3d(4px,0,0)}
      30%,50%,70%{transform:translate3d(-6px,0,0)}
      40%,60%{transform:translate3d(6px,0,0)}
    }
    .dice-ui { color: var(--text-main); height: 100%; display: flex; flex-direction: column; gap: 8px; }
    .dice-hint { color: var(--text-dim); font-size: 0.95rem; }
    .dice-svg { width: 100%; height: 240px; touch-action: none; }
    .dice-stage { flex: 1; perspective: 700px; display: flex; align-items: center; justify-content: center; touch-action: none; }
    .dice-box { width: 80px; height: 80px; position: relative; transform-style: preserve-3d; }
    .face {
      position: absolute; left: 50%; top: 50%;
      display: flex; align-items: center; justify-content: center;
      background: #c9a36a; border: 2px solid #5c4324; font-weight: 700; color: #2a1c0c;
      backface-visibility: hidden;
    }
    .f-front,.f-back { width: 80px; height: 80px; margin: -40px 0 0 -40px; }
    .f-right,.f-left { width: 200px; height: 80px; margin: -40px 0 0 -100px; }
    .f-top,.f-bottom { width: 80px; height: 200px; margin: -100px 0 0 -40px; }
    .f-front { transform: translateZ(100px); }
    .f-back { transform: rotateY(180deg) translateZ(100px); }
    .f-right { transform: rotateY(90deg) translateZ(40px); }
    .f-left { transform: rotateY(-90deg) translateZ(40px); }
    .f-top { transform: rotateX(90deg) translateZ(40px); }
    .f-bottom { transform: rotateX(-90deg) translateZ(40px); }
    .dice-readout { font-size: 0.95rem; }
    .quiz { color: var(--text-main); display: flex; flex-direction: column; gap: 12px; padding-top: 12px; }
    .quiz-prompt { font-size: 1.05rem; line-height: 1.5; }
    .quiz-choices { display: flex; gap: 10px; flex-wrap: wrap; }
    .quiz-choice {
      background: #1c2430; color: var(--text-main); border: 1px solid var(--accent);
      padding: 10px 16px; border-radius: 8px; font-size: 1.1rem; cursor: pointer;
    }
    .quiz-feedback { color: #ffb4a2; min-height: 1.4em; }
    #dice-measure {
      align-self: flex-start; background: var(--accent); color: #1a1408; border: 0;
      padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer;
    }
  
    #path-svg { width: 100%; height: 220px; }
    #path-svg .stem { stroke: #8d6e63; stroke-width: 4; }
    #path-svg .branch { stroke: #5c4636; stroke-width: 6; }
    #path-svg .branch.on { stroke: #e5a93b; stroke-width: 8; }
    #path-svg .nd circle { fill: #f0e6d2; }
    #path-svg .nd.hot { cursor: pointer; }
    #path-svg .nd.hot circle { fill: #e5a93b; }
    #path-svg text { font-size: 13px; font-weight: 700; fill: #2a1c0c; }
    .pups { display: flex; gap: 12px; justify-content: center; margin: 16px 0; }
    .pup {
      width: 64px; height: 64px; border-radius: 50% 50% 40% 40%; border: 3px solid #3a2a1c;
      font-size: 22px; font-weight: 800; color: #2a1c0c; cursor: pointer;
    }

    .nono-grid { display: grid; gap: 4px; justify-content: center; margin-top: 8px; }
    .nono-grid .clue { font-size: 11px; color: #f0e6d2; display: flex; align-items: center; justify-content: flex-end; white-space: pre; line-height: 1.1; }
    .nono-grid .clue.top { width: 32px; max-width: 32px; box-sizing: border-box; flex-direction: column; align-items: center; justify-content: end; min-height: 40px; overflow: hidden; }
    .nono-grid .clue.top span { display: block; height: 16px; line-height: 16px; font-size: 13px; }
    .nono-grid .cell { width: 32px; height: 32px; background: #f7f1e6; border: 1px solid #6b4a22; border-radius: 2px; cursor: pointer; padding: 0; }
    #nono-msg { margin-top: 12px; }
    .nono-grid .cell.on { background: #3a3a3a; }
</style>
</head>
<body>
  <div id="game-container">
    <div id="tension-wrap"><div id="tension-fill"></div></div>
    <div id="evidence-bag"></div>
    <div id="stage-layer"><div class="actor theron"><i></i>테론</div><div class="actor iris"><i></i>이리스</div></div>
    <div id="focus-lines"></div>
    <div id="widget-root" hidden></div>
    <div id="dialogue-layer">
      <div class="speaker-name" id="speaker-box">피타고라스 학당</div>
      <div class="dialogue-text" id="text-box"></div>
      <div class="next-indicator">엔터, 스페이스, 클릭으로 진행 ▼</div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script type="module" src="engine/app.js?v=70"></script>
</body>
</html>

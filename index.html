<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>폴리곤과 운명의 주사위 — 경우의 수와 확률</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <style>
    :root {
      --bg-dark: #12141a;
      --card-bg: rgba(22, 27, 34, 0.92);
      --accent: #e5a93b;
      --accent-glow: rgba(229, 169, 59, 0.4);
      --text-main: #f0f6fc;
      --text-dim: #8b949e;
      --border: rgba(240, 246, 252, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1200px;
      max-height: 720px;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      box-shadow: 0 12px 48px rgba(0,0,0,0.8);
      border-radius: 8px;
    }
    #stage-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.3s ease-out;
    }
    #character-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding-bottom: 140px;
    }
    #dialogue-layer {
      position: absolute;
      bottom: 16px;
      left: 24px;
      right: 24px;
      min-height: 140px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 24px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }
    .speaker-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .dialogue-text {
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--text-main);
      min-height: 50px;
    }
    .next-indicator {
      align-self: flex-end;
      font-size: 0.85rem;
      color: var(--text-dim);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .screen-shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="stage-layer"></div>
    <div id="character-layer"></div>
    <div id="dialogue-layer">
      <div class="speaker-name" id="speaker-box">피타고라스 학당</div>
      <div class="dialogue-text" id="text-box">Engine v2 준비 완료. 6단원 경우의 수와 확률 모듈이 로드되었습니다.</div>
      <div class="next-indicator">클릭하여 진행 ▼</div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
</body>
</html>

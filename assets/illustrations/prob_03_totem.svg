<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1711"/>
      <stop offset="50%" stop-color="#2a2016"/>
      <stop offset="100%" stop-color="#16100b"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e8cc"/>
      <stop offset="100%" stop-color="#deb887"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="50%" stop-color="#a67c52"/>
      <stop offset="100%" stop-color="#6f4e37"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="600" height="380" rx="12" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="576" height="356" rx="8" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>
  <rect x="18" y="18" width="564" height="344" rx="6" fill="none" stroke="#5c4324" stroke-width="1" stroke-dasharray="6,4"/>
  
  <!-- Header Title Banner -->
  <path d="M 160 22 L 440 22 L 420 54 L 180 54 Z" fill="url(#gold)" filter="url(#shadow)"/>
  <text x="300" y="44" text-anchor="middle" font-family="serif" font-weight="bold" font-size="16" fill="#1c1308">3장 문지기 암호 · 해골 동전과 주사위</text>
  
  
  <!-- Coin on Left -->
  <g transform="translate(160, 200)" filter="url(#shadow)">
    <circle r="75" fill="url(#parchment)" stroke="url(#gold)" stroke-width="4"/>
    <circle r="60" fill="none" stroke="#8b5a2b" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="0" y="-14" text-anchor="middle" font-family="serif" font-weight="bold" font-size="32" fill="#4a2e12">앞면 (H)</text>
    <text x="0" y="28" text-anchor="middle" font-size="16" fill="#7a4e22">고대 해골 은화</text>
  </g>

  <!-- Multiplication Symbol -->
  <text x="300" y="210" text-anchor="middle" font-family="serif" font-weight="bold" font-size="44" fill="url(#gold)">×</text>

  <!-- Dice with Primes on Right -->
  <g transform="translate(440, 200)" filter="url(#shadow)">
    <rect x="-75" y="-75" width="150" height="150" rx="18" fill="url(#parchment)" stroke="url(#gold)" stroke-width="4"/>
    <text x="0" y="-35" text-anchor="middle" font-family="serif" font-size="15" fill="#7a4e22">주사위 소수 눈</text>
    <g transform="translate(0, 15)">
      <circle cx="-40" cy="0" r="20" fill="#e67e22"/>
      <text x="-40" y="7" text-anchor="middle" font-weight="bold" font-size="20" fill="#fff">2</text>
      <circle cx="0" cy="0" r="20" fill="#e67e22"/>
      <text x="0" y="7" text-anchor="middle" font-weight="bold" font-size="20" fill="#fff">3</text>
      <circle cx="40" cy="0" r="20" fill="#e67e22"/>
      <text x="40" y="7" text-anchor="middle" font-weight="bold" font-size="20" fill="#fff">5</text>
    </g>
  </g>

</svg>
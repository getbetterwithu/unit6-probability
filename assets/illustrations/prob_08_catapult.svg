<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1711"/>
      <stop offset="50%" stop-color="#2a2016"/>
      <stop offset="100%" stop-color="#16100b"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e8cc"/>
      <stop offset="100%" stop-color="#deb887"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="50%" stop-color="#a67c52"/>
      <stop offset="100%" stop-color="#6f4e37"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="600" height="380" rx="12" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="576" height="356" rx="8" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>
  <rect x="18" y="18" width="564" height="344" rx="6" fill="none" stroke="#5c4324" stroke-width="1" stroke-dasharray="6,4"/>
  
  <!-- Header Title Banner -->
  <path d="M 160 22 L 440 22 L 420 54 L 180 54 Z" fill="url(#gold)" filter="url(#shadow)"/>
  <text x="300" y="44" text-anchor="middle" font-family="serif" font-weight="bold" font-size="16" fill="#1c1308">5장 학당 서고 · 고대 공성 투석기 도면</text>
  
  
  <g transform="translate(300, 205)" filter="url(#shadow)">
    <!-- Catapult Blueprint -->
    <rect x="-220" y="-110" width="440" height="220" rx="14" fill="#2c3e50" stroke="url(#gold)" stroke-width="2.5"/>
    <line x1="-200" y1="70" x2="200" y2="70" stroke="#7f8c8d" stroke-width="4"/>
    
    <!-- Wooden Frame -->
    <polygon points="-120,70 -80,-50 -40,70" fill="none" stroke="#d4a373" stroke-width="8"/>
    <line x1="-80" y1="-50" x2="80" y2="30" stroke="#a67c52" stroke-width="10"/>
    <circle cx="-80" cy="-50" r="14" fill="#f39c12"/>
    <circle cx="90" cy="35" r="22" fill="#7f8c8d"/>
    <path d="M 90 35 Q 160 -60 210 -20" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="6,4"/>
    
    <text x="0" y="-70" text-anchor="middle" font-size="16" fill="#ecf0f1">테론의 원거리 투석기 기계 장치</text>
  </g>

</svg>
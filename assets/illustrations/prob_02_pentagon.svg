<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#241a12"/>
      <stop offset="100%" stop-color="#0e0a06"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f5b041"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="600" height="360" rx="12" fill="url(#bgGrad)" stroke="#5c4324" stroke-width="2"/>

  <!-- 타이틀 배너 -->
  <rect x="180" y="16" width="240" height="28" rx="6" fill="rgba(0,0,0,0.5)" stroke="#d4af37" stroke-width="1.2"/>
  <text x="300" y="35" text-anchor="middle" fill="#ffd152" font-size="13" font-weight="bold" letter-spacing="1">
    소폴로스 상단 · 정오각형 제단 암호
  </text>

  <!-- 시계방향 회전 가이드 원호 -->
  <path d="M 300 70 A 130 130 0 1 1 200 100" fill="none" stroke="#f5b041" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)" opacity="0.6"/>
  <text x="440" y="100" fill="#f5b041" font-size="12" font-weight="bold">시계 방향 이동 ▶</text>

  <!-- 정오각형 기하학 (중심: 300, 195, 반지름 R=105) -->
  <!-- A (위): 300, 90 -->
  <!-- B (우상): 400, 163 -->
  <!-- C (우하): 362, 280 -->
  <!-- D (좌하): 238, 280 -->
  <!-- E (좌상): 200, 163 -->
  <polygon points="300,90 400,163 362,280 238,280 200,163"
           fill="rgba(212, 175, 55, 0.08)" stroke="#d4af37" stroke-width="3" filter="url(#goldGlow)"/>

  <!-- 내부 대각선 별 룬 장식 -->
  <polygon points="300,90 362,280 200,163 400,163 238,280"
           fill="none" stroke="#5c4324" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- 꼭짓점 룬 노드들 -->
  <!-- 꼭짓점 A (출발점) -->
  <circle cx="300" cy="90" r="16" fill="#c0392b" stroke="#ffd152" stroke-width="2.5" filter="url(#goldGlow)"/>
  <text x="300" y="95" text-anchor="middle" fill="#fff" font-size="15" font-weight="900">A</text>
  <rect x="250" y="52" width="100" height="20" rx="4" fill="#c0392b" stroke="#ffd152" stroke-width="1"/>
  <text x="300" y="66" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">출발점 (루비 말)</text>

  <!-- 꼭짓점 B -->
  <circle cx="400" cy="163" r="14" fill="#2a1f14" stroke="#d4af37" stroke-width="2"/>
  <text x="400" y="168" text-anchor="middle" fill="#ffeaa7" font-size="14" font-weight="bold">B</text>

  <!-- 꼭짓점 C -->
  <circle cx="362" cy="280" r="14" fill="#2a1f14" stroke="#d4af37" stroke-width="2"/>
  <text x="362" y="285" text-anchor="middle" fill="#ffeaa7" font-size="14" font-weight="bold">C</text>

  <!-- 꼭짓점 D -->
  <circle cx="238" cy="280" r="14" fill="#2a1f14" stroke="#d4af37" stroke-width="2"/>
  <text x="238" y="285" text-anchor="middle" fill="#ffeaa7" font-size="14" font-weight="bold">D</text>

  <!-- 꼭짓점 E (목표점) -->
  <circle cx="200" cy="163" r="17" fill="#27ae60" stroke="#ffd152" stroke-width="2.5" filter="url(#goldGlow)"/>
  <text x="200" y="169" text-anchor="middle" fill="#fff" font-size="15" font-weight="900">E</text>
  <rect x="150" y="125" width="100" height="20" rx="4" fill="#27ae60" stroke="#ffd152" stroke-width="1"/>
  <text x="200" y="139" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">✨ 목표 지점 (E)</text>

  <!-- 하단 설명 배너 -->
  <g transform="translate(60, 318)">
    <rect width="480" height="28" rx="6" fill="rgba(0,0,0,0.6)" stroke="#5c4324" stroke-width="1"/>
    <text x="240" y="19" text-anchor="middle" fill="#bdc3c7" font-size="12">
      주사위 2개의 눈의 합 = <tspan fill="#ffd152" font-weight="bold">이동 칸수</tspan> (합 4칸 이동 시 E, 합 9칸 이동 시 E)
    </text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="caveBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1812"/>
      <stop offset="100%" stop-color="#0a0805"/>
    </radialGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d2f20"/>
      <stop offset="50%" stop-color="#241c13"/>
      <stop offset="100%" stop-color="#140f09"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="600" height="360" rx="12" fill="url(#caveBg)" stroke="#5c4324" stroke-width="2"/>

  <!-- 타이틀 배너 -->
  <rect x="170" y="14" width="260" height="26" rx="5" fill="rgba(0,0,0,0.5)" stroke="#2ed573" stroke-width="1.2"/>
  <text x="300" y="32" text-anchor="middle" fill="#2ed573" font-size="13" font-weight="bold" letter-spacing="1">
    어두운 광맥 갱도 · 고대 석문의 방정식 봉인
  </text>

  <!-- 거대한 석문 구조체 -->
  <path d="M 120 340 L 120 130 Q 300 40 480 130 L 480 340 Z"
        fill="url(#doorGrad)" stroke="#6b5335" stroke-width="4"/>

  <!-- 석문 좌우 빗장 틈새 -->
  <line x1="300" y1="90" x2="300" y2="340" stroke="#0a0805" stroke-width="5"/>

  <!-- 석문 중심 마법진 원형 판 -->
  <circle cx="300" cy="195" r="95" fill="#18120b" stroke="#d4af37" stroke-width="3" filter="url(#emeraldGlow)"/>
  <circle cx="300" cy="195" r="86" fill="none" stroke="#2ed573" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 중앙 일차방정식 수식 (순수 문제 수식만!) -->
  <text x="300" y="205" text-anchor="middle" fill="#ffd152" font-size="34" font-family="'Courier New', monospace" font-weight="900" letter-spacing="2">
    ax - b = 0
  </text>

  <!-- 좌측 첫 번째 주사위 a 슬롯 -->
  <g transform="translate(65, 155)">
    <rect width="80" height="85" rx="10" fill="#2c1e14" stroke="#d4af37" stroke-width="2"/>
    <text x="40" y="26" text-anchor="middle" fill="#bdc3c7" font-size="11" font-weight="bold">첫 번째 주사위</text>
    <text x="40" y="64" text-anchor="middle" fill="#ffd152" font-size="36" font-weight="900">a</text>
  </g>

  <!-- 우측 두 번째 주사위 b 슬롯 -->
  <g transform="translate(455, 155)">
    <rect width="80" height="85" rx="10" fill="#2c1e14" stroke="#d4af37" stroke-width="2"/>
    <text x="40" y="26" text-anchor="middle" fill="#bdc3c7" font-size="11" font-weight="bold">두 번째 주사위</text>
    <text x="40" y="64" text-anchor="middle" fill="#ffd152" font-size="36" font-weight="900">b</text>
  </g>

  <!-- 에메랄드 원석 장식 (석문 상단 쐐기돌) -->
  <polygon points="300,55 315,75 300,95 285,75" fill="#2ed573" stroke="#fff" stroke-width="1.5" filter="url(#emeraldGlow)"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="100%" height="100%">
  <defs>
    <radialGradient id="scrollBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#241a12"/>
      <stop offset="100%" stop-color="#0e0a06"/>
    </radialGradient>
    <linearGradient id="papyrusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e8cf"/>
      <stop offset="50%" stop-color="#ecd9b5"/>
      <stop offset="100%" stop-color="#dfc59b"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="620" height="380" rx="14" fill="url(#scrollBg)" stroke="#5c4324" stroke-width="2.5"/>

  <!-- 타이틀 배너 -->
  <rect x="140" y="16" width="340" height="30" rx="6" fill="rgba(0,0,0,0.6)" stroke="#d4af37" stroke-width="1.2"/>
  <text x="310" y="36" text-anchor="middle" fill="#ffd152" font-size="13" font-weight="bold" letter-spacing="1">
    학당 서고 · 고대 파피루스 특수 전개도 주사위
  </text>

  <!-- ============================================== -->
  <!-- [좌측: 주사위 A 전개도 (1이 3개, 2가 3개)] -->
  <!-- ============================================== -->
  <g transform="translate(60, 65)">
    <!-- 파피루스 판재 -->
    <rect x="-10" y="0" width="230" height="250" rx="10" fill="url(#papyrusGrad)" stroke="#8c6d46" stroke-width="2"/>

    <!-- 전개도 그리드 (칸 크기: 44x44) -->
    <!-- 기준 원점: (x=24, y=20) -->
    <!-- 십자 형태:
         (row 0, col 1): 상단 (1)
         (row 1, col 0): 좌 (2)
         (row 1, col 1): 중앙 (1)
         (row 1, col 2): 우 (2)
         (row 1, col 3): 우우 (2)
         (row 2, col 1): 하단 (1)
    -->

    <!-- 상단: 1 -->
    <rect x="68" y="24" width="44" height="44" fill="#fffdfa" stroke="#1c1308" stroke-width="2"/>
    <text x="90" y="55" text-anchor="middle" fill="#1c1308" font-size="24" font-weight="900">1</text>

    <!-- 좌: 2 -->
    <rect x="24" y="68" width="44" height="44" fill="#fffdfa" stroke="#1c1308" stroke-width="2"/>
    <text x="46" y="99" text-anchor="middle" fill="#1c1308" font-size="24" font-weight="900">2</text>

    <!-- 중앙: 1 -->
    <rect x="68" y="68" width="44" height="44" fill="#fffdfa" stroke="#1c1308" stroke-width="2"/>
    <text x="90" y="99" text-anchor="middle" fill="#1c1308" font-size="24" font-weight="900">1</text>

    <!-- 우: 2 -->
    <rect x="112" y="68" width="44" height="44" fill="#fffdfa" stroke="#1c1308" stroke-width="2"/>
    <text x="134" y="99" text-anchor="middle" fill="#1c1308" font-size="24" font-weight="900">2</text>

    <!-- 우우: 2 -->
    <rect x="156" y="68" width="44" height="44" fill="#fffdfa" stroke="#1c1308" stroke-width="2"/>
    <text x="178" y="99" text-anchor="middle" fill="#1c1308" font-size="24" font-weight="900">2</text>

    <!-- 하단: 1 -->
    <rect x="68" y="112" width="44" height="44" fill="#fffdfa" stroke="#1c1308" stroke-width="2"/>
    <text x="90" y="143" text-anchor="middle" fill="#1c1308" font-size="24" font-weight="900">1</text>

    <!-- 접는 점선 (내부 접는 선들) -->
    <line x1="68" y1="68" x2="112" y2="68" stroke="#7f8c8d" stroke-width="1.8" stroke-dasharray="3 3"/>
    <line x1="68" y1="112" x2="112" y2="112" stroke="#7f8c8d" stroke-width="1.8" stroke-dasharray="3 3"/>
    <line x1="68" y1="68" x2="68" y2="112" stroke="#7f8c8d" stroke-width="1.8" stroke-dasharray="3 3"/>
    <line x1="112" y1="68" x2="112" y2="112" stroke="#7f8c8d" stroke-width="1.8" stroke-dasharray="3 3"/>
    <line x1="156" y1="68" x2="156" y2="112" stroke="#7f8c8d" stroke-width="1.8" stroke-dasharray="3 3"/>

    <!-- 하단 라벨 -->
    <rect x="45" y="190" width="120" height="30" rx="6" fill="#1c1308" stroke="#d4af37" stroke-width="1.5"/>
    <text x="105" y="210" text-anchor="middle" fill="#ffd152" font-size="14" font-weight="900">[주사위 A]</text>
    <text x="105" y="235" text-anchor="middle" fill="#5c4324" font-size="11" font-weight="bold">1이 3개 · 2가 3개</text>
  </g>

  <!-- ============================================== -->
  <!-- [우측: 주사위 B 전개도 (1이 2개, 2가 4개)] -->
  <!-- ============================================== -->
  <g transform="translate(350, 65)">
    <!-- 파피루스 판재 -->
    <rect x="-10" y="0" width="230" height="250" rx="10" fill="url(#papyrusGrad)" stroke="#8c6d46" stroke-width="2"/>

    <!-- 상단: 2 (교과서 원본: 상단이 2!) -->
    <rect x="68" y="24" width="44" height="44" fill="#fffdfa" stroke="#1c1308" stroke-width="2"/>
    <text x="90" y="55" text-anchor="middle" fill="#1c1308" font-size="24" font-weight="900">2</text>

    <!-- 좌: 2 -->
    <rect x="24" y="68" width="44" height="44" fill="#fffdfa" stroke="#1c1308" stroke-width="2"/>
    <text x="46" y="99" text-anchor="middle" fill="#1c1308" font-size="24" font-weight="900">2</text>

    <!-- 중앙: 1 -->
    <rect x="68" y="68" width="44" height="44" fill="#fffdfa" stroke="#1c1308" stroke-width="2"/>
    <text x="90" y="99" text-anchor="middle" fill="#1c1308" font-size="24" font-weight="900">1</text>

    <!-- 우: 2 -->
    <rect x="112" y="68" width="44" height="44" fill="#fffdfa" stroke="#1c1308" stroke-width="2"/>
    <text x="134" y="99" text-anchor="middle" fill="#1c1308" font-size="24" font-weight="900">2</text>

    <!-- 우우: 2 -->
    <rect x="156" y="68" width="44" height="44" fill="#fffdfa" stroke="#1c1308" stroke-width="2"/>
    <text x="178" y="99" text-anchor="middle" fill="#1c1308" font-size="24" font-weight="900">2</text>

    <!-- 하단: 1 -->
    <rect x="68" y="112" width="44" height="44" fill="#fffdfa" stroke="#1c1308" stroke-width="2"/>
    <text x="90" y="143" text-anchor="middle" fill="#1c1308" font-size="24" font-weight="900">1</text>

    <!-- 접는 점선 -->
    <line x1="68" y1="68" x2="112" y2="68" stroke="#7f8c8d" stroke-width="1.8" stroke-dasharray="3 3"/>
    <line x1="68" y1="112" x2="112" y2="112" stroke="#7f8c8d" stroke-width="1.8" stroke-dasharray="3 3"/>
    <line x1="68" y1="68" x2="68" y2="112" stroke="#7f8c8d" stroke-width="1.8" stroke-dasharray="3 3"/>
    <line x1="112" y1="68" x2="112" y2="112" stroke="#7f8c8d" stroke-width="1.8" stroke-dasharray="3 3"/>
    <line x1="156" y1="68" x2="156" y2="112" stroke="#7f8c8d" stroke-width="1.8" stroke-dasharray="3 3"/>

    <!-- 하단 라벨 -->
    <rect x="45" y="190" width="120" height="30" rx="6" fill="#1c1308" stroke="#d4af37" stroke-width="1.5"/>
    <text x="105" y="210" text-anchor="middle" fill="#ffd152" font-size="14" font-weight="900">[주사위 B]</text>
    <text x="105" y="235" text-anchor="middle" fill="#5c4324" font-size="11" font-weight="bold">1이 2개 · 2가 4개</text>
  </g>

  <!-- 하단 안내 배너 -->
  <rect x="50" y="340" width="520" height="26" rx="5" fill="rgba(0,0,0,0.5)" stroke="#5c4324" stroke-width="1"/>
  <text x="310" y="357" text-anchor="middle" fill="#ffeaa7" font-size="12" font-weight="bold">
    ※ 두 주사위 A, B를 동시에 던져 나온 두 눈의 수의 곱이 2 또는 4가 될 확률을 구하시오.
  </text>
</svg>

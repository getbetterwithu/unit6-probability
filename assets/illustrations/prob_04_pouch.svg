      <text x="0" y="6" text-anchor="middle" font-weight="bold" font-size="13" fill="#fff">적</text>
    </g>
    <!-- Blue diamonds (3) -->
    <g transform="translate(-60, 70)">
      <polygon points="0,-22 18,0 0,22 -18,0" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-weight="bold" font-size="11" fill="#fff">청</text>
    </g>
    <g transform="translate(0, 60)">

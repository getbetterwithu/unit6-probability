  <text x="300" y="44" text-anchor="middle" font-family="serif" font-weight="bold" font-size="16" fill="#1c1308">4장 마법 주머니 · 다이아몬드 추출</text>
  
  
  <g transform="translate(300, 215)" filter="url(#shadow)">

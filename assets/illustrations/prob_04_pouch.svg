    <ellipse cx="0" cy="-110" rx="55" ry="16" fill="#5c2e0b" stroke="url(#gold)" stroke-width="2"/>
    
    <!-- Red diamonds (2) -->
    <g transform="translate(-55, 10)">
      <polygon points="0,-26 22,0 0,26 -22,0" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-weight="bold" font-size="13" fill="#fff">적</text>
    </g>
    <g transform="translate(55, 10)">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="100%" height="100%">
  <defs>
    <radialGradient id="vaultBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#241a10"/>
      <stop offset="100%" stop-color="#0a0704"/>
    </radialGradient>
    <linearGradient id="bronzePlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2a1a"/>
      <stop offset="50%" stop-color="#261a10"/>
      <stop offset="100%" stop-color="#181008"/>
    </linearGradient>
    <marker id="arrowGold" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f39c12"/>
    </marker>
    <marker id="arrowGoldRev" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f39c12"/>
    </marker>
  </defs>

  <!-- 배경 캔버스 -->
  <rect width="620" height="380" rx="14" fill="url(#vaultBg)" stroke="#5c4324" stroke-width="2.5"/>

  <!-- 타이틀 배너 -->
  <rect x="130" y="16" width="360" height="30" rx="6" fill="rgba(0,0,0,0.6)" stroke="#d4af37" stroke-width="1.2"/>
  <text x="310" y="36" text-anchor="middle" fill="#ffd152" font-size="13" font-weight="bold" letter-spacing="1">
    테론의 편향 가공 직육면체 주사위 · 실측 확률표
  </text>

  <!-- ============================================================== -->
  <!-- 좌측: 솔리드 3면 3D 직육면체 주사위 (방안 1: 납작한 타일/방석 형태)     -->
  <!-- ============================================================== -->
  <g id="solid-cuboid-dice">
    <!-- 바닥 베이스 그림자 -->
    <ellipse cx="130" cy="240" rx="90" ry="24" fill="rgba(0,0,0,0.65)" filter="blur(6px)"/>

    <!-- 1. 윗면 (Top: 6의 눈 - 가장 넓고 밝은 조명 톤) -->
    <polygon points="40,175 165,175 220,120 95,120" fill="#4e3822" stroke="#d4af37" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 윗면 6의 눈 (넓은 면적에 2열 3행 여유롭게 정렬) -->
    <g fill="#ffd152">
      <!-- 좌측 열 -->
      <circle cx="85" cy="160" r="5"/>
      <circle cx="108" cy="147" r="5"/>
      <circle cx="131" cy="135" r="5"/>
      <!-- 우측 열 -->
      <circle cx="130" cy="160" r="5"/>
      <circle cx="153" cy="147" r="5"/>
      <circle cx="176" cy="135" r="5"/>
    </g>
    <text x="130" y="105" text-anchor="middle" fill="#ffd152" font-size="12" font-weight="900">✨ 넓은 윗면 [6의 눈]</text>

    <!-- 2. 앞면 (Front: 얇은 직사각형 옆면, 2의 눈) -->
    <polygon points="40,175 165,175 165,222 40,222" fill="#322214" stroke="#d4af37" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 앞면 2의 눈 (가로 배치) -->
    <g fill="#fffdf8">
      <circle cx="80" cy="198" r="4.5"/>
      <circle cx="125" cy="198" r="4.5"/>
    </g>
    <text x="102" y="216" text-anchor="middle" fill="#bdc3c7" font-size="10" font-weight="bold">옆면 [2의 눈]</text>

    <!-- 3. 우측면 (Right: 얇은 직사각형 옆면, 3의 눈) -->
    <polygon points="165,175 220,120 220,167 165,222" fill="#20150b" stroke="#d4af37" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 우측면 3의 눈 (모서리 따라 배치) -->
    <g fill="#fffdf8">
      <circle cx="180" cy="190" r="4"/>
      <circle cx="193" cy="167" r="4"/>
      <circle cx="206" cy="145" r="4"/>
    </g>
    <text x="195" y="205" text-anchor="middle" fill="#bdc3c7" font-size="10" font-weight="bold">옆면 [3]</text>

    <!-- ============================================================ -->
    <!-- 3대 치수선 (가로 2.5, 세로 2.5, 두께 1)                        -->
    <!-- ============================================================ -->
    <!-- [가로 2.5 치수선] 앞면 밑변 아래 -->
    <line x1="40" y1="240" x2="165" y2="240" stroke="#f39c12" stroke-width="1.8" marker-start="url(#arrowGoldRev)" marker-end="url(#arrowGold)"/>
    <line x1="40" y1="230" x2="40" y2="248" stroke="#f39c12" stroke-width="1"/>
    <line x1="165" y1="230" x2="165" y2="248" stroke="#f39c12" stroke-width="1"/>
    <text x="102" y="258" text-anchor="middle" fill="#f39c12" font-size="12" font-weight="900">가로 2.5</text>

    <!-- [세로 2.5 치수선] 우측면 밑변 사선 아래 -->
    <line x1="172" y1="236" x2="227" y2="181" stroke="#f39c12" stroke-width="1.8" marker-start="url(#arrowGoldRev)" marker-end="url(#arrowGold)"/>
    <line x1="168" y1="232" x2="176" y2="240" stroke="#f39c12" stroke-width="1"/>
    <line x1="223" y1="177" x2="231" y2="185" stroke="#f39c12" stroke-width="1"/>
    <text x="210" y="222" text-anchor="start" fill="#f39c12" font-size="12" font-weight="900">세로 2.5</text>

    <!-- [두께 1 치수선] 좌측 수직 모서리 바깥 -->
    <line x1="26" y1="175" x2="26" y2="222" stroke="#f39c12" stroke-width="1.8" marker-start="url(#arrowGoldRev)" marker-end="url(#arrowGold)"/>
    <line x1="20" y1="175" x2="32" y2="175" stroke="#f39c12" stroke-width="1"/>
    <line x1="20" y1="222" x2="32" y2="222" stroke="#f39c12" stroke-width="1"/>
    <text x="18" y="203" text-anchor="end" fill="#f39c12" font-size="12" font-weight="900">두께 1</text>
  </g>

  <!-- ============================================================== -->
  <!-- 우측: 고대 청동 실측 확률표                                    -->
  <!-- ============================================================== -->
  <g transform="translate(265, 75)">
    <!-- 표 외곽 카드 -->
    <rect width="320" height="260" rx="10" fill="url(#bronzePlate)" stroke="#d4af37" stroke-width="2"/>

    <!-- 표 헤더 -->
    <rect width="320" height="38" rx="10" fill="rgba(212,175,55,0.25)"/>
    <line x1="0" y1="38" x2="320" y2="38" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="120" y1="0" x2="120" y2="260" stroke="#5c4324" stroke-width="1.2"/>

    <text x="60" y="24" text-anchor="middle" fill="#ffd152" font-size="13" font-weight="900">주사위 눈</text>
    <text x="220" y="24" text-anchor="middle" fill="#ffd152" font-size="13" font-weight="900">실측 확률</text>

    <!-- 1행: 1의 눈 (넓은 정사각 아랫면) -->
    <line x1="0" y1="75" x2="320" y2="75" stroke="#3d2b1a" stroke-width="1"/>
    <text x="60" y="60" text-anchor="middle" fill="#ffeaa7" font-size="12" font-weight="800">1 (넓은 아랫면)</text>
    <text x="220" y="62" text-anchor="middle" fill="#2ecc71" font-size="15" font-weight="900">1 / 4</text>

    <!-- 2행: 2의 눈 (얇은 직사각 옆면) -->
    <line x1="0" y1="112" x2="320" y2="112" stroke="#3d2b1a" stroke-width="1"/>
    <text x="60" y="97" text-anchor="middle" fill="#bdc3c7" font-size="12">2 (얇은 옆면)</text>
    <text x="220" y="99" text-anchor="middle" fill="#ffeaa7" font-size="14" font-weight="700">1 / 8</text>

    <!-- 3행: 3의 눈 (얇은 직사각 옆면) -->
    <line x1="0" y1="149" x2="320" y2="149" stroke="#3d2b1a" stroke-width="1"/>
    <text x="60" y="134" text-anchor="middle" fill="#bdc3c7" font-size="12">3 (얇은 옆면)</text>
    <text x="220" y="136" text-anchor="middle" fill="#ffeaa7" font-size="14" font-weight="700">1 / 8</text>

    <!-- 4행: 4의 눈 (얇은 직사각 옆면) -->
    <line x1="0" y1="186" x2="320" y2="186" stroke="#3d2b1a" stroke-width="1"/>
    <text x="60" y="171" text-anchor="middle" fill="#bdc3c7" font-size="12">4 (얇은 옆면)</text>
    <text x="220" y="173" text-anchor="middle" fill="#ffeaa7" font-size="14" font-weight="700">1 / 8</text>

    <!-- 5행: 5의 눈 (얇은 직사각 옆면) -->
    <line x1="0" y1="223" x2="320" y2="223" stroke="#3d2b1a" stroke-width="1"/>
    <text x="60" y="208" text-anchor="middle" fill="#bdc3c7" font-size="12">5 (얇은 옆면)</text>
    <text x="220" y="210" text-anchor="middle" fill="#ffeaa7" font-size="14" font-weight="700">1 / 8</text>

    <!-- 6행: 6의 눈 (넓은 정사각 윗면) -->
    <text x="60" y="245" text-anchor="middle" fill="#ffd152" font-size="12" font-weight="900">✨ 6 (넓은 윗면)</text>
    <text x="220" y="247" text-anchor="middle" fill="#ffd152" font-size="16" font-weight="900">1 / 4</text>
  </g>

  <!-- 하단 안내 박스 -->
  <rect x="50" y="344" width="520" height="24" rx="4" fill="rgba(0,0,0,0.5)" stroke="#5c4324" stroke-width="1"/>
  <text x="310" y="360" text-anchor="middle" fill="#bdc3c7" font-size="11">
    ※ 주사위 2개를 동시에 던질 때, 두 눈의 수의 합이 12가 될 확률을 계산하시오.
  </text>
</svg>

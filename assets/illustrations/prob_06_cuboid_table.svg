<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="100%" height="100%">
  <defs>
    <radialGradient id="vaultBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#241a10"/>
      <stop offset="100%" stop-color="#0a0704"/>
    </radialGradient>
    <linearGradient id="bronzePlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2a1a"/>
      <stop offset="50%" stop-color="#261a10"/>
      <stop offset="100%" stop-color="#181008"/>
    </linearGradient>
    <marker id="arrowGold" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f39c12"/>
    </marker>
    <marker id="arrowGoldRev" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f39c12"/>
    </marker>
  </defs>

  <!-- 배경 캔버스 -->
  <rect width="620" height="380" rx="14" fill="url(#vaultBg)" stroke="#5c4324" stroke-width="2.5"/>

  <!-- 타이틀 배너 -->
  <rect x="130" y="16" width="360" height="30" rx="6" fill="rgba(0,0,0,0.6)" stroke="#d4af37" stroke-width="1.2"/>
  <text x="310" y="36" text-anchor="middle" fill="#ffd152" font-size="13" font-weight="bold" letter-spacing="1">
    테론의 편향 가공 직육면체 주사위 · 실측 확률표
  </text>

  <!-- ============================================================== -->
  <!-- 좌측: 솔리드 3면 3D 직육면체 주사위 (보이는 3개 면만 표현)         -->
  <!-- ============================================================== -->
  <g id="solid-cuboid-dice">
    <!-- 바닥 베이스 그림자 -->
    <ellipse cx="115" cy="265" rx="70" ry="16" fill="rgba(0,0,0,0.65)" filter="blur(5px)"/>

    <!-- 1. 윗면 (Top: 6의 눈 - 가장 밝은 조명 톤) -->
    <polygon points="65,115 125,115 165,85 105,85" fill="#4e3822" stroke="#d4af37" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 윗면 6의 눈 (투영 각도에 맞게 2열 3행 정렬) -->
    <g fill="#ffd152">
      <circle cx="83" cy="107" r="4.2"/>
      <circle cx="98" cy="99" r="4.2"/>
      <circle cx="113" cy="91" r="4.2"/>
      <circle cx="113" cy="107" r="4.2"/>
      <circle cx="128" cy="99" r="4.2"/>
      <circle cx="143" cy="91" r="4.2"/>
    </g>
    <text x="115" y="75" text-anchor="middle" fill="#ffd152" font-size="11" font-weight="900">윗면 [6의 눈]</text>

    <!-- 2. 앞면 (Front: 2의 눈 - 중간 조명 톤) -->
    <polygon points="65,115 125,115 125,255 65,255" fill="#322214" stroke="#d4af37" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 앞면 2의 눈 (대각선 배치) -->
    <g fill="#fffdf8">
      <circle cx="85" cy="155" r="5"/>
      <circle cx="105" cy="215" r="5"/>
    </g>
    <text x="95" y="244" text-anchor="middle" fill="#bdc3c7" font-size="11" font-weight="bold">앞면 [2의 눈]</text>

    <!-- 3. 우측면 (Right: 3의 눈 - 깊은 음영 톤) -->
    <polygon points="125,115 165,85 165,225 125,255" fill="#20150b" stroke="#d4af37" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 우측면 3의 눈 (대각선 배치) -->
    <g fill="#fffdf8">
      <circle cx="138" cy="135" r="4.5"/>
      <circle cx="145" cy="170" r="4.5"/>
      <circle cx="152" cy="205" r="4.5"/>
    </g>
    <text x="145" y="222" text-anchor="middle" fill="#bdc3c7" font-size="10" font-weight="bold">옆면 [3]</text>

    <!-- ============================================================ -->
    <!-- 3대 치수선 (가로 1, 세로 1, 높이 2.5)                         -->
    <!-- ============================================================ -->
    <!-- [가로 1 치수선] 앞면 밑변 아래 -->
    <line x1="65" y1="272" x2="125" y2="272" stroke="#f39c12" stroke-width="1.8" marker-start="url(#arrowGoldRev)" marker-end="url(#arrowGold)"/>
    <line x1="65" y1="262" x2="65" y2="278" stroke="#f39c12" stroke-width="1"/>
    <line x1="125" y1="262" x2="125" y2="278" stroke="#f39c12" stroke-width="1"/>
    <text x="95" y="290" text-anchor="middle" fill="#f39c12" font-size="12" font-weight="900">가로 1</text>

    <!-- [세로 1 치수선] 우측면 밑변 사선 아래 -->
    <line x1="130" y1="270" x2="170" y2="240" stroke="#f39c12" stroke-width="1.8" marker-start="url(#arrowGoldRev)" marker-end="url(#arrowGold)"/>
    <line x1="127" y1="264" x2="133" y2="274" stroke="#f39c12" stroke-width="1"/>
    <line x1="167" y1="234" x2="173" y2="244" stroke="#f39c12" stroke-width="1"/>
    <text x="160" y="268" text-anchor="start" fill="#f39c12" font-size="12" font-weight="900">세로 1</text>

    <!-- [높이 2.5 치수선] 좌측 수직 모서리 바깥 -->
    <line x1="48" y1="115" x2="48" y2="255" stroke="#f39c12" stroke-width="1.8" marker-start="url(#arrowGoldRev)" marker-end="url(#arrowGold)"/>
    <line x1="42" y1="115" x2="54" y2="115" stroke="#f39c12" stroke-width="1"/>
    <line x1="42" y1="255" x2="54" y2="255" stroke="#f39c12" stroke-width="1"/>
    <text x="40" y="190" text-anchor="end" fill="#f39c12" font-size="12" font-weight="900">높이 2.5</text>
  </g>

  <!-- ============================================================== -->
  <!-- 우측: 고대 청동 실측 확률표                                    -->
  <!-- ============================================================== -->
  <g transform="translate(265, 75)">
    <!-- 표 외곽 카드 -->
    <rect width="320" height="260" rx="10" fill="url(#bronzePlate)" stroke="#d4af37" stroke-width="2"/>

    <!-- 표 헤더 -->
    <rect width="320" height="38" rx="10" fill="rgba(212,175,55,0.25)"/>
    <line x1="0" y1="38" x2="320" y2="38" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="120" y1="0" x2="120" y2="260" stroke="#5c4324" stroke-width="1.2"/>

    <text x="60" y="24" text-anchor="middle" fill="#ffd152" font-size="13" font-weight="900">주사위 눈</text>
    <text x="220" y="24" text-anchor="middle" fill="#ffd152" font-size="13" font-weight="900">실측 확률</text>

    <!-- 1행: 1의 눈 (정사각 아랫면) -->
    <line x1="0" y1="75" x2="320" y2="75" stroke="#3d2b1a" stroke-width="1"/>
    <text x="60" y="60" text-anchor="middle" fill="#ffeaa7" font-size="12" font-weight="800">1 (정사각 아랫면)</text>
    <text x="220" y="62" text-anchor="middle" fill="#2ecc71" font-size="15" font-weight="900">1 / 4</text>

    <!-- 2행: 2의 눈 (직사각 옆면) -->
    <line x1="0" y1="112" x2="320" y2="112" stroke="#3d2b1a" stroke-width="1"/>
    <text x="60" y="97" text-anchor="middle" fill="#bdc3c7" font-size="12">2 (직사각 옆면)</text>
    <text x="220" y="99" text-anchor="middle" fill="#ffeaa7" font-size="14" font-weight="700">1 / 8</text>

    <!-- 3행: 3의 눈 (직사각 옆면) -->
    <line x1="0" y1="149" x2="320" y2="149" stroke="#3d2b1a" stroke-width="1"/>
    <text x="60" y="134" text-anchor="middle" fill="#bdc3c7" font-size="12">3 (직사각 옆면)</text>
    <text x="220" y="136" text-anchor="middle" fill="#ffeaa7" font-size="14" font-weight="700">1 / 8</text>

    <!-- 4행: 4의 눈 (직사각 옆면) -->
    <line x1="0" y1="186" x2="320" y2="186" stroke="#3d2b1a" stroke-width="1"/>
    <text x="60" y="171" text-anchor="middle" fill="#bdc3c7" font-size="12">4 (직사각 옆면)</text>
    <text x="220" y="173" text-anchor="middle" fill="#ffeaa7" font-size="14" font-weight="700">1 / 8</text>

    <!-- 5행: 5의 눈 (직사각 옆면) -->
    <line x1="0" y1="223" x2="320" y2="223" stroke="#3d2b1a" stroke-width="1"/>
    <text x="60" y="208" text-anchor="middle" fill="#bdc3c7" font-size="12">5 (직사각 옆면)</text>
    <text x="220" y="210" text-anchor="middle" fill="#ffeaa7" font-size="14" font-weight="700">1 / 8</text>

    <!-- 6행: 6의 눈 (정사각 윗면) -->
    <text x="60" y="245" text-anchor="middle" fill="#ffd152" font-size="12" font-weight="900">✨ 6 (정사각 윗면)</text>
    <text x="220" y="247" text-anchor="middle" fill="#ffd152" font-size="16" font-weight="900">1 / 4</text>
  </g>

  <!-- 하단 안내 박스 -->
  <rect x="50" y="344" width="520" height="24" rx="4" fill="rgba(0,0,0,0.5)" stroke="#5c4324" stroke-width="1"/>
  <text x="310" y="360" text-anchor="middle" fill="#bdc3c7" font-size="11">
    ※ 주사위 2개를 동시에 던질 때, 두 눈의 수의 합이 12가 될 확률을 계산하시오.
  </text>
</svg>

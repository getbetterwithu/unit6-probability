<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1711"/>
      <stop offset="50%" stop-color="#2a2016"/>
      <stop offset="100%" stop-color="#16100b"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e8cc"/>
      <stop offset="100%" stop-color="#deb887"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="50%" stop-color="#a67c52"/>
      <stop offset="100%" stop-color="#6f4e37"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="600" height="380" rx="12" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="576" height="356" rx="8" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>
  <rect x="18" y="18" width="564" height="344" rx="6" fill="none" stroke="#5c4324" stroke-width="1" stroke-dasharray="6,4"/>
  
  <!-- Header Title Banner -->
  <path d="M 160 22 L 440 22 L 420 54 L 180 54 Z" fill="url(#gold)" filter="url(#shadow)"/>
  <text x="300" y="44" text-anchor="middle" font-family="serif" font-weight="bold" font-size="16" fill="#1c1308">6장 다이아 금고 · 500회 시행 실측 기록</text>
  
  
  <g transform="translate(300, 205)" filter="url(#shadow)">
    <rect x="-220" y="-115" width="440" height="210" rx="10" fill="url(#parchment)" stroke="#5c4324" stroke-width="2"/>
    
    <!-- Header Row -->
    <rect x="-215" y="-110" width="430" height="42" fill="#8b5a2b"/>
    <text x="-120" y="-83" text-anchor="middle" font-weight="bold" font-size="16" fill="#fff">던진 횟수 (전체 시행)</text>
    <text x="120" y="-83" text-anchor="middle" font-weight="bold" font-size="16" fill="#fff">6의 눈이 나온 횟수</text>

    <!-- Data Row 1 -->
    <text x="-120" y="-35" text-anchor="middle" font-size="17" fill="#333">100회</text>
    <text x="120" y="-35" text-anchor="middle" font-size="17" fill="#333">26회</text>
    <line x1="-215" y1="-18" x2="215" y2="-18" stroke="#c4a47c"/>

    <!-- Data Row 2 -->
    <text x="-120" y="10" text-anchor="middle" font-size="17" fill="#333">300회</text>
    <text x="120" y="10" text-anchor="middle" font-size="17" fill="#333">74회</text>
    <line x1="-215" y1="28" x2="215" y2="28" stroke="#c4a47c"/>

    <!-- Data Row 3 (Final) -->
    <rect x="-215" y="32" width="430" height="55" fill="#fff3cd"/>
    <text x="-120" y="68" text-anchor="middle" font-weight="bold" font-size="22" fill="#856404">총 500회</text>
    <text x="120" y="68" text-anchor="middle" font-weight="bold" font-size="22" fill="#e74c3c">125회 관측</text>
  </g>

</svg>
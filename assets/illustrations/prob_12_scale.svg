<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1711"/>
      <stop offset="50%" stop-color="#2a2016"/>
      <stop offset="100%" stop-color="#16100b"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e8cc"/>
      <stop offset="100%" stop-color="#deb887"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="50%" stop-color="#a67c52"/>
      <stop offset="100%" stop-color="#6f4e37"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="600" height="380" rx="12" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="576" height="356" rx="8" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>
  <rect x="18" y="18" width="564" height="344" rx="6" fill="none" stroke="#5c4324" stroke-width="1" stroke-dasharray="6,4"/>
  
  <!-- Header Title Banner -->
  <path d="M 160 22 L 440 22 L 420 54 L 180 54 Z" fill="url(#gold)" filter="url(#shadow)"/>
  <text x="300" y="44" text-anchor="middle" font-family="serif" font-weight="bold" font-size="16" fill="#1c1308">6장 다이아 금고 · 10개의 숫자 번호판</text>
  
  
  <g transform="translate(300, 205)" filter="url(#shadow)">
    <rect x="-240" y="-90" width="480" height="180" rx="14" fill="#2c241b" stroke="url(#gold)" stroke-width="3"/>
    <text x="0" y="-55" text-anchor="middle" font-weight="bold" font-size="16" fill="#ffeaa7">소폴로스가 내놓은 10개의 숫자 판</text>
    
    <!-- 1~5 Top row -->
    <g transform="translate(-160, -12)">
        <rect x="-30" y="-22" width="60" height="44" rx="8" fill="url(#parchment)" stroke="#8b5a2b" stroke-width="2.5"/>
        <text x="0" y="8" text-anchor="middle" font-weight="bold" font-size="22" fill="#2c1e11">1</text>
      </g><g transform="translate(-80, -12)">
        <rect x="-30" y="-22" width="60" height="44" rx="8" fill="url(#parchment)" stroke="#8b5a2b" stroke-width="2.5"/>
        <text x="0" y="8" text-anchor="middle" font-weight="bold" font-size="22" fill="#2c1e11">2</text>
      </g><g transform="translate(0, -12)">
        <rect x="-30" y="-22" width="60" height="44" rx="8" fill="url(#parchment)" stroke="#8b5a2b" stroke-width="2.5"/>
        <text x="0" y="8" text-anchor="middle" font-weight="bold" font-size="22" fill="#2c1e11">3</text>
      </g><g transform="translate(80, -12)">
        <rect x="-30" y="-22" width="60" height="44" rx="8" fill="url(#parchment)" stroke="#8b5a2b" stroke-width="2.5"/>
        <text x="0" y="8" text-anchor="middle" font-weight="bold" font-size="22" fill="#2c1e11">4</text>
      </g><g transform="translate(160, -12)">
        <rect x="-30" y="-22" width="60" height="44" rx="8" fill="url(#parchment)" stroke="#8b5a2b" stroke-width="2.5"/>
        <text x="0" y="8" text-anchor="middle" font-weight="bold" font-size="22" fill="#2c1e11">5</text>
      </g>

    <!-- 6~10 Bottom row -->
    <g transform="translate(-160, 46)">
        <rect x="-30" y="-22" width="60" height="44" rx="8" fill="url(#parchment)" stroke="#8b5a2b" stroke-width="2.5"/>
        <text x="0" y="8" text-anchor="middle" font-weight="bold" font-size="22" fill="#2c1e11">6</text>
      </g><g transform="translate(-80, 46)">
        <rect x="-30" y="-22" width="60" height="44" rx="8" fill="url(#parchment)" stroke="#8b5a2b" stroke-width="2.5"/>
        <text x="0" y="8" text-anchor="middle" font-weight="bold" font-size="22" fill="#2c1e11">7</text>
      </g><g transform="translate(0, 46)">
        <rect x="-30" y="-22" width="60" height="44" rx="8" fill="url(#parchment)" stroke="#8b5a2b" stroke-width="2.5"/>
        <text x="0" y="8" text-anchor="middle" font-weight="bold" font-size="22" fill="#2c1e11">8</text>
      </g><g transform="translate(80, 46)">
        <rect x="-30" y="-22" width="60" height="44" rx="8" fill="url(#parchment)" stroke="#8b5a2b" stroke-width="2.5"/>
        <text x="0" y="8" text-anchor="middle" font-weight="bold" font-size="22" fill="#2c1e11">9</text>
      </g><g transform="translate(160, 46)">
        <rect x="-30" y="-22" width="60" height="44" rx="8" fill="url(#parchment)" stroke="#8b5a2b" stroke-width="2.5"/>
        <text x="0" y="8" text-anchor="middle" font-weight="bold" font-size="22" fill="#2c1e11">10</text>
      </g>
  </g>

</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="caveBlueBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#152636"/>
      <stop offset="100%" stop-color="#080e14"/>
    </radialGradient>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="600" height="360" rx="12" fill="url(#caveBlueBg)" stroke="#1e90ff" stroke-width="1.8"/>

  <!-- 타이틀 배너 -->
  <rect x="160" y="16" width="280" height="28" rx="6" fill="rgba(0,0,0,0.5)" stroke="#1e90ff" stroke-width="1.2"/>
  <text x="300" y="35" text-anchor="middle" fill="#70a1ff" font-size="13" font-weight="bold" letter-spacing="1">
    빛나는 다이아 동굴 · 피캐스의 마법 주사위
  </text>

  <!-- 좌측 주사위 A (청옥빛) -->
  <g transform="translate(100, 105)">
    <rect width="130" height="130" rx="18" fill="#1e272e" stroke="#70a1ff" stroke-width="3" filter="url(#blueGlow)"/>
    <circle cx="40" cy="40" r="10" fill="#70a1ff"/>
    <circle cx="90" cy="90" r="10" fill="#70a1ff"/>
    <circle cx="65" cy="65" r="10" fill="#ffd152"/>
    <text x="65" y="160" text-anchor="middle" fill="#d2dae2" font-size="15" font-weight="bold">첫 번째 주사위</text>
  </g>

  <!-- 중앙 곱셈 연산 기호 -->
  <g transform="translate(265, 135)">
    <circle cx="35" cy="35" r="32" fill="#0f1923" stroke="#ffd152" stroke-width="2.5"/>
    <text x="35" y="47" text-anchor="middle" fill="#ffd152" font-size="40" font-weight="900">×</text>
  </g>

  <!-- 우측 주사위 B (청옥빛) -->
  <g transform="translate(370, 105)">
    <rect width="130" height="130" rx="18" fill="#1e272e" stroke="#70a1ff" stroke-width="3" filter="url(#blueGlow)"/>
    <circle cx="40" cy="40" r="10" fill="#70a1ff"/>
    <circle cx="90" cy="40" r="10" fill="#70a1ff"/>
    <circle cx="40" cy="90" r="10" fill="#70a1ff"/>
    <circle cx="90" cy="90" r="10" fill="#70a1ff"/>
    <text x="65" y="160" text-anchor="middle" fill="#d2dae2" font-size="15" font-weight="bold">두 번째 주사위</text>
  </g>

  <!-- 하단 순수 상황 배너 -->
  <g transform="translate(140, 305)">
    <rect width="320" height="34" rx="6" fill="rgba(0,0,0,0.6)" stroke="#5c4324" stroke-width="1"/>
    <text x="160" y="22" text-anchor="middle" fill="#ffeaa7" font-size="13" font-weight="bold">
      두 주사위를 동시에 던져 나온 두 눈의 수의 곱
    </text>
  </g>
</svg>